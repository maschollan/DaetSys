<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DaetSys &mdash; Digital Asset &amp; Evidence Tracking System</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #0f766e;
    --accent-soft: #ccfbf1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 1rem;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem 1.75rem;
    text-align: center;
  }

  .logo {
    width: 52px;
    height: 52px;
    margin: 0 auto 1rem;
    border-radius: 12px;
    background: var(--accent);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 1.25rem;
    color: #ecfdf5;
  }

  h1 {
    margin: 0 0 .35rem;
    font-size: 1.3rem;
  }

  p.lead {
    margin: 0 0 1.5rem;
    color: var(--muted);
    font-size: .875rem;
    line-height: 1.55;
  }

  .countdown {
    margin: 0 0 1.25rem;
    font-size: .85rem;
    color: var(--muted);
  }

  .countdown strong {
    color: var(--accent-soft);
  }

  .countdown button {
    background: none;
    border: none;
    color: var(--accent-soft);
    font: inherit;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  .actions {
    display: grid;
    gap: .75rem;
  }

  .actions a {
    display: block;
    padding: .7rem .75rem;
  }

  a {
    display: block;
    padding: .7rem .75rem;
    border-radius: 8px;
    font-size: .95rem;
    font-weight: 600;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { filter: brightness(1.12); }

  .btn-secondary {
    border: 1px solid var(--border);
    color: var(--text);
    background: #0b1220;
  }

  .btn-secondary:hover { border-color: var(--accent-soft); }

  .footnote {
    margin: 1.5rem 0 0;
    color: var(--muted);
    font-size: .78rem;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">DS</div>
    <h1>DaetSys</h1>
    <p class="lead">Pencatatan aset &amp; bukti. Domain ini adalah layanan API DaetSys.</p>

    <p class="countdown" id="countdown">
      Mengalihkan ke aplikasi dalam <strong id="seconds">5</strong> detik &mdash;
      <button type="button" id="cancel">batal</button>
    </p>

    <div class="actions">
      <a id="go-app" class="btn-primary" href="">Masuk ke Aplikasi</a>
      <a class="btn-secondary" href="/docs">Buka Dokumentasi API</a>
    </div>

    <p class="footnote">DaetSys &mdash; Digital Asset &amp; Evidence Tracking System</p>
  </main>

<script>
  (function () {
    var FRONTEND_URL = '[[FRONTEND_URL]]';
    var remaining = 5;
    var seconds = document.getElementById('seconds');
    var countdown = document.getElementById('countdown');
    var goApp = document.getElementById('go-app');

    goApp.href = FRONTEND_URL;

    var timer = setInterval(function () {
      remaining -= 1;
      if (remaining <= 0) {
        window.location.href = FRONTEND_URL;
        return;
      }
      seconds.textContent = String(remaining);
    }, 1000);

    document.getElementById('cancel').addEventListener('click', function () {
      clearInterval(timer);
      countdown.textContent = 'Pengalihan otomatis dibatalkan \u2014 gunakan tombol di bawah ini.';
    });
  })();
</script>
</body>
</html>
