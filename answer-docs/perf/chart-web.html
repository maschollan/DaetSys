<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: #ffffff; font-family: "Segoe UI", Arial, sans-serif; }
  svg { display: block; }
  .bar { fill: #0d9488; }
  .bar-warn { fill: #d97706; }
  .bar-label { font-size: 12px; fill: #334155; }
  .val { font-size: 11px; fill: #0f172a; }
  .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
  .sub { font-size: 11px; fill: #64748b; }
  .axis { stroke: #cbd5e1; stroke-width: 1; }
</style>
</head>
<body>
<div id="chart" style="width:1240px">
  <svg id="svg" width="1240" height="470"></svg>
</div>
<script>
const data = [
  ["Boot SPA /login (Load event)", 331, "ok"],
  ["Login SPA -> data Dashboard tampil", 33527, "warn"],
  ["Buka /assets (klik, data tampil)", 7156, "ok"],
  ["Buka /transfers (klik, data tampil)", 7379, "ok"],
  ["Buka /reports (klik, data tampil)", 5317, "ok"],
  ["Buka /audit-logs (klik, data tampil)", 10083, "ok"],
  ["/docs/login (Load event, API host)", 1496, "ok"],
  ["Login /docs -> Scalar siap", 8944, "ok"],
  ["Fetch /docs/api.json (rerata 2x)", 2789, "ok"],
];
const svg = document.getElementById("svg");
const ns = "http://www.w3.org/2000/svg";
const left = 330, barH = 26, gap = 14, barTop = 74;
const max = Math.max(...data.map(d => d[1])) * 1.12;
function el(name, attrs, text) {
  const e = document.createElementNS(ns, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text) e.textContent = text;
  svg.appendChild(e);
  return e;
}
el("text", { x: 20, y: 42, class: "title" }, "Waktu Muat Aplikasi Web DaetSys (produksi)");
el("text", { x: 20, y: 62, class: "sub" }, "Satu sesi Playwright, cache bawah server dinonaktifkan — klik sampai data terlihat — 24 Okt 2026");
data.forEach((d, i) => {
  const y = barTop + i * (barH + gap);
  el("text", { x: left - 10, y: y + barH / 2 + 4, class: "bar-label", "text-anchor": "end" }, d[0]);
  const w = (d[1] / max) * (1160 - left);
  el("rect", { x: left, y: y, width: Math.max(2, w), height: barH, class: d[2] === "warn" ? "bar-warn" : "bar", rx: 3 });
  el("text", { x: left + Math.max(2, w) + 8, y: y + barH / 2 + 4, class: "val" }, d[1].toLocaleString("id-ID") + " ms");
});
el("line", { x1: left, y1: barTop - 6, x2: left, y2: barTop + data.length * (barH + gap), class: "axis" });
</script>
</body>
</html>
